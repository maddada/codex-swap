name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/homebrew.py"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and check the executable
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "$TARGET"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match Cargo.toml version v$version" >&2
            exit 1
          fi
          binary="target/$TARGET/release/xswap"
          if [[ "$RUNNER_OS" == macOS ]]; then
            codesign --force --sign - "$binary"
            codesign --verify --strict "$binary"
          else
            if readelf -l "$binary" | grep -q INTERP; then
              echo "Linux release must be static" >&2
              exit 1
            fi
          fi
          [[ "$("$binary" --version)" == "xswap $version" ]]
          "$binary" --help
          mkdir -p staging release
          cp "$binary" LICENSE README.md THIRD_PARTY_NOTICES.md staging/
          tar -czf "release/codex-swap-$version-$TARGET.tar.gz" -C staging xswap LICENSE README.md THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release/*.tar.gz
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate checksums and Homebrew formula
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 scripts/homebrew.py "$version" release release/codex-swap.rb
          ruby -c release/codex-swap.rb
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-release
          path: release/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: assemble
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-release
          path: release
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "codex-swap $RELEASE_TAG"
