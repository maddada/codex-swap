name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: target/release/xswap --version
      - run: target/release/xswap --help
      - name: Check release archives and formula
        if: runner.os == 'Linux'
        run: python3 scripts/test_homebrew.py
      - name: Validate POSIX installer
        if: runner.os == 'Linux'
        run: |
          sh -n scripts/install.sh
          shellcheck -s sh scripts/install.sh
      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/test_install.ps1), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
      - name: Check native installer with mocked downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_install.ps1 -Binary target/release/xswap.exe
      - uses: actions/upload-artifact@v4
        with:
          name: xswap-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/xswap
            target/release/xswap.exe

  auto-swap:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests/auto_swap -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the tested official Codex CLI
        run: npm install --global @openai/codex@0.166.0
      - name: Check native synchronous handoff with a local mock model
        run: python3 tests/auto_swap/native_checkpoint_smoke.py
      - run: sh -n scripts/codex-auto-cli
      - name: Validate zsh integration
        run: |
          if command -v zsh >/dev/null 2>&1; then zsh -n scripts/codex-auto.zsh; fi
