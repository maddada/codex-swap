[package]
name = "codex-swap"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Account-specific Codex launches with shared conversation history"
license = "MIT"
repository = "https://github.com/maddada/codex-swap"
readme = "README.md"

[[bin]]
name = "xswap"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects"] }

[profile.release]
lto = "thin"
strip = true
